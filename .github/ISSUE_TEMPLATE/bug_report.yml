name: Bug report
description: Something behaves differently from what the docs or code comments say.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Security issue?** Do not file it here. Use a
        [private security advisory](https://github.com/DevTobis/ballast/security/advisories/new)
        (see SECURITY.md).
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - contracts (Soroban)
        - services/api
        - services/keeper
        - services/price-guard
        - services/margin-monitor / indexer / ledger
        - services/issuer-gateway / payout-hop
        - packages/*
        - apps/console
        - scripts / deploy
        - docs
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Include the exact error text.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, requests, or transactions. A failing test is ideal.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: Network (local / testnet), commit hash, Node and stellar-cli versions, OS.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, transaction hashes, contract IDs
      description: Remove secrets before pasting.
